<text x="30" y="800" font-size="12" fill="#555" text-anchor="start">All grounds meet at the breakout's GND, the panel's − included. GPIO 34 and 35 are ADC1: the only analog inputs that work with Wi-Fi on.</text>
<text x="30" y="818" font-size="12" fill="#555" text-anchor="start">One I2C bus at 100 kHz for three parts (0x68 + its EEPROM 0x57, 0x44, 0x76): no address clashes. Crossing wires without a dot are not joined.</text>
