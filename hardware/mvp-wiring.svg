<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="1000" height="660" fill="#ffffff"/>
  <text x="30" y="36" font-size="22" font-weight="bold" fill="#222">SUNDIAL wall — MVP wiring</text>
  <text x="30" y="58" font-size="13" fill="#555">Modules on a screw-terminal breakout. No custom board, no soldering. hardware/MVP.md</text>

  <!-- legend -->
  <g font-size="12" fill="#333">
    <line x1="640" y1="30" x2="670" y2="30" stroke="#d62828" stroke-width="3"/><text x="676" y="34">panel voltage (up to ~48 V)</text>
    <line x1="640" y1="48" x2="670" y2="48" stroke="#f08c00" stroke-width="3"/><text x="676" y="52">5 V / 3.3 V</text>
    <line x1="820" y1="30" x2="850" y2="30" stroke="#222" stroke-width="3"/><text x="856" y="34">GND</text>
    <line x1="820" y1="48" x2="850" y2="48" stroke="#1f6feb" stroke-width="3"/><text x="856" y="52">signal</text>
  </g>

  <!-- PV panel -->
  <rect x="30" y="100" width="150" height="110" rx="6" fill="#e8eef7" stroke="#334" stroke-width="2"/>
  <g stroke="#9ab" stroke-width="1"><line x1="30" y1="137" x2="180" y2="137"/><line x1="30" y1="173" x2="180" y2="173"/><line x1="80" y1="100" x2="80" y2="210"/><line x1="130" y1="100" x2="130" y2="210"/></g>
  <text x="105" y="230" text-anchor="middle" font-weight="bold">PV panel</text>
  <text x="105" y="247" text-anchor="middle" font-size="12" fill="#555">Trina 185 W, V_oc 44.5 V</text>
  <text x="188" y="122" font-size="12">+</text><text x="188" y="196" font-size="12">−</text>

  <!-- fuse -->
  <rect x="225" y="105" width="70" height="30" rx="4" fill="#fff" stroke="#334" stroke-width="2"/>
  <text x="260" y="125" text-anchor="middle" font-size="12">MC4 fuse</text>
  <text x="260" y="152" text-anchor="middle" font-size="11" fill="#555">2 A</text>

  <!-- buck -->
  <rect x="345" y="95" width="140" height="120" rx="6" fill="#fff4e0" stroke="#334" stroke-width="2"/>
  <text x="415" y="150" text-anchor="middle" font-weight="bold">Buck converter</text>
  <text x="415" y="167" text-anchor="middle" font-size="12" fill="#555">8–60 V in → 5.0 V</text>
  <text x="415" y="182" text-anchor="middle" font-size="11" fill="#a00">set 5.0 V first</text>
  <text x="352" y="122" font-size="11">IN+</text><text x="352" y="200" font-size="11">IN−</text>
  <text x="452" y="122" font-size="11">OUT+</text><text x="452" y="200" font-size="11">OUT−</text>

  <!-- panel + to fuse to buck IN+ -->
  <polyline points="180,120 225,120" fill="none" stroke="#d62828" stroke-width="3"/>
  <polyline points="295,120 345,120" fill="none" stroke="#d62828" stroke-width="3"/>
  <!-- panel - to buck IN- -->
  <polyline points="180,195 345,195" fill="none" stroke="#222" stroke-width="3"/>

  <!-- divider tap from fused + -->
  <circle cx="320" cy="120" r="4" fill="#d62828"/>
  <polyline points="320,120 320,300" fill="none" stroke="#d62828" stroke-width="3"/>
  <rect x="300" y="300" width="40" height="70" rx="3" fill="#fff" stroke="#334" stroke-width="2"/>
  <text x="320" y="340" text-anchor="middle" font-size="12">100k</text>
  <polyline points="320,370 320,410" fill="none" stroke="#1f6feb" stroke-width="3"/>
  <circle cx="320" cy="410" r="4" fill="#1f6feb"/>
  <rect x="300" y="430" width="40" height="60" rx="3" fill="#fff" stroke="#334" stroke-width="2"/>
  <text x="320" y="465" text-anchor="middle" font-size="12">4.7k</text>
  <polyline points="320,410 320,430" fill="none" stroke="#1f6feb" stroke-width="3"/>
  <polyline points="320,490 320,520" fill="none" stroke="#222" stroke-width="3"/>
  <!-- 100nF -->
  <polyline points="320,410 270,410 270,440" fill="none" stroke="#1f6feb" stroke-width="3"/>
  <line x1="255" y1="440" x2="285" y2="440" stroke="#334" stroke-width="3"/>
  <line x1="255" y1="450" x2="285" y2="450" stroke="#334" stroke-width="3"/>
  <polyline points="270,450 270,520" fill="none" stroke="#222" stroke-width="3"/>
  <text x="205" y="448" font-size="12">100 nF</text>
  <text x="200" y="345" font-size="12" fill="#555">divider:</text>
  <text x="200" y="361" font-size="12" fill="#555">panel voltage,</text>
  <text x="200" y="377" font-size="12" fill="#555">dawn and dusk</text>
  <polyline points="320,410 520,410" fill="none" stroke="#1f6feb" stroke-width="3"/>

  <!-- ESP32 breakout -->
  <rect x="520" y="250" width="200" height="330" rx="8" fill="#eef6ee" stroke="#334" stroke-width="2"/>
  <rect x="560" y="270" width="120" height="290" rx="4" fill="#2b2b2b"/>
  <text x="620" y="300" text-anchor="middle" fill="#fff" font-weight="bold">ESP32</text>
  <text x="620" y="318" text-anchor="middle" fill="#ccc" font-size="11">ELEGOO 30-pin</text>
  <text x="620" y="545" text-anchor="middle" fill="#ccc" font-size="11">on screw-terminal</text>
  <text x="620" y="558" text-anchor="middle" fill="#ccc" font-size="11">breakout</text>
  <!-- left side terminals -->
  <g font-size="12" fill="#222">
    <text x="527" y="295">5V</text>
    <text x="527" y="335">GND</text>
    <text x="527" y="415">G34</text>
    <text x="527" y="475">G35</text>
  </g>
  <!-- right side terminals -->
  <g font-size="12" fill="#222">
    <text x="688" y="295">3V3</text>
    <text x="688" y="335">GND</text>
    <text x="690" y="395">G4</text>
    <text x="688" y="455">G21</text>
    <text x="688" y="485">G22</text>
  </g>

  <!-- buck out to ESP32 -->
  <polyline points="485,120 500,120 500,290 520,290" fill="none" stroke="#f08c00" stroke-width="3"/>
  <polyline points="485,195 495,195 495,330 520,330" fill="none" stroke="#222" stroke-width="3"/>
  <!-- common GND bus at bottom -->
  <polyline points="270,520 320,520 495,520" fill="none" stroke="#222" stroke-width="3"/>
  <polyline points="495,330 495,520" fill="none" stroke="#222" stroke-width="3"/>
  <circle cx="495" cy="330" r="4" fill="#222"/><circle cx="320" cy="520" r="4" fill="#222"/>
  <text x="345" y="512" font-size="12" fill="#555">common GND</text>

  <!-- reference cell -->
  <rect x="40" y="440" width="130" height="80" rx="4" fill="#e8eef7" stroke="#334" stroke-width="2"/>
  <g stroke="#9ab"><line x1="40" y1="480" x2="170" y2="480"/><line x1="105" y1="440" x2="105" y2="520"/></g>
  <text x="105" y="540" text-anchor="middle" font-weight="bold">Reference cell</text>
  <text x="105" y="556" text-anchor="middle" font-size="12" fill="#555">6 V mini panel, 0.5–1 W,</text>
  <text x="105" y="571" text-anchor="middle" font-size="12" fill="#555">on the panel frame</text>
  <!-- cell + to G35, R_cell across -->
  <polyline points="170,455 200,455 200,600 470,600 470,470 520,470" fill="none" stroke="#1f6feb" stroke-width="3"/>
  <circle cx="200" cy="600" r="4" fill="#1f6feb"/>
  <rect x="185" y="590" width="0" height="0"/>
  <polyline points="200,600 200,610" fill="none" stroke="#1f6feb" stroke-width="3"/>
  <rect x="185" y="610" width="30" height="34" rx="3" fill="#fff" stroke="#334" stroke-width="2"/>
  <text x="225" y="632" font-size="12">R_cell ≈ 1.0 V ÷ I_sc (5–10 Ω)</text>
  <polyline points="170,505 180,505 180,652 200,652 200,644" fill="none" stroke="#222" stroke-width="3"/>
  <polyline points="180,652 440,652 440,520" fill="none" stroke="#222" stroke-width="3"/>
  <circle cx="440" cy="520" r="4" fill="#222"/>
  <text x="300" y="594" font-size="12" fill="#1f6feb">sun → G35</text>

  <!-- DS18B20 -->
  <rect x="800" y="360" width="170" height="60" rx="6" fill="#fff" stroke="#334" stroke-width="2"/>
  <text x="885" y="384" text-anchor="middle" font-weight="bold">DS18B20 probe</text>
  <text x="885" y="402" text-anchor="middle" font-size="12" fill="#555">on the panel back</text>
  <polyline points="720,390 800,390" fill="none" stroke="#1f6feb" stroke-width="3"/>
  <text x="723" y="382" font-size="11" fill="#1f6feb">yellow</text>
  <polyline points="720,290 760,290 760,412 800,412" fill="none" stroke="#f08c00" stroke-width="3"/>
  <text x="764" y="425" font-size="11" fill="#f08c00">red</text>
  <!-- 4.7k pullup between 3V3 and G4 -->
  <rect x="768" y="335" width="34" height="18" rx="2" fill="#fff" stroke="#334" stroke-width="2"/>
  <text x="808" y="348" font-size="11">4.7k G4–3V3</text>
  <polyline points="760,344 768,344" fill="none" stroke="#f08c00" stroke-width="2"/>
  <polyline points="802,344 790,344 790,390" fill="none" stroke="#1f6feb" stroke-width="2"/>
  <circle cx="790" cy="390" r="3" fill="#1f6feb"/>
  <polyline points="720,330 740,330 740,440 885,440 885,420" fill="none" stroke="#222" stroke-width="3"/>
  <text x="890" y="436" font-size="11">black</text>

  <!-- DS3231 -->
  <rect x="800" y="470" width="170" height="90" rx="6" fill="#fff" stroke="#334" stroke-width="2"/>
  <text x="885" y="494" text-anchor="middle" font-weight="bold">DS3231 clock</text>
  <text x="885" y="512" text-anchor="middle" font-size="12" fill="#555">+ CR2032</text>
  <text x="885" y="530" text-anchor="middle" font-size="11" fill="#a00">remove the charging</text>
  <text x="885" y="544" text-anchor="middle" font-size="11" fill="#a00">diode/resistor (ZS-042)</text>
  <polyline points="720,450 800,450 800,480" fill="none" stroke="#1f6feb" stroke-width="3"/>
  <text x="768" y="446" font-size="11" fill="#1f6feb">SDA</text>
  <polyline points="720,480 790,480 790,500 800,500" fill="none" stroke="#1f6feb" stroke-width="3"/>
  <text x="768" y="476" font-size="11" fill="#1f6feb">SCL</text>
  <polyline points="760,412 760,600 830,600 830,560" fill="none" stroke="#f08c00" stroke-width="3"/>
  <text x="835" y="590" font-size="11" fill="#f08c00">VCC 3V3</text>
  <polyline points="740,440 740,620 930,620 930,560" fill="none" stroke="#222" stroke-width="3"/>
  <text x="935" y="590" font-size="11">GND</text>

  <text x="30" y="645" font-size="11" fill="#555"></text>
</svg>
